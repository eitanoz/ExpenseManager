<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Package Manager</title>
  
  <!-- PWA Meta tags for Android & iOS standalone installation -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 sm:p-6 pb-20">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-200 pb-5 mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-wallet text-indigo-600"></i> Expense & Package Manager
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">
          Connected to Google Sheets &bull; Base Currency: <span class="font-semibold text-slate-700">ILS (₪)</span>
        </p>
      </div>
      <div class="flex items-center gap-2 self-start sm:self-auto">
        <button id="pwaInstallBtn" onclick="installPWA()" class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white shadow-sm hover:bg-indigo-700 transition">
          <i class="fa-solid fa-download"></i> Install App
        </button>
        <div id="syncStatus" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Cloud Synced</span>
        </div>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex space-x-2 border-b border-slate-200 mb-6 overflow-x-auto pb-1 text-sm font-medium">
      <button onclick="switchTab('expenses')" id="tab-expenses" class="tab-btn px-4 py-2 border-b-2 border-indigo-600 text-indigo-600 font-semibold flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-receipt"></i> Expenses
      </button>
      <button onclick="switchTab('analytics')" id="tab-analytics" class="tab-btn px-4 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-chart-pie"></i> Analytics & Stats
      </button>
      <button onclick="switchTab('packages')" id="tab-packages" class="tab-btn px-4 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-box"></i> Package Tracker
      </button>
      <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn px-4 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-gear"></i> Cards & Settings
      </button>
    </nav>

    <!-- Main Content Area -->
    <main>
      <!-- TAB 1: EXPENSES -->
      <section id="view-expenses" class="space-y-6">
        <!-- New / Edit Expense Form -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <div class="flex items-center justify-between mb-4">
            <h2 id="formHeader" class="text-base font-semibold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-plus-circle text-indigo-500"></i> Add New Expense
            </h2>
            <button type="button" id="cancelEditBtn" onclick="cancelExpenseEdit()" class="hidden text-xs text-rose-500 hover:underline">
              <i class="fa-solid fa-xmark"></i> Cancel Edit
            </button>
          </div>

          <form id="expenseForm" onsubmit="handleExpenseSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <input type="hidden" id="editExpId" value="" />
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Date</label>
              <input type="date" id="expDate" required class="w-full text-sm rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Description</label>
              <input type="text" id="expDesc" placeholder="e.g. Grocery Store, Coffee" required class="w-full text-sm rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Amount & Currency</label>
              <div class="flex gap-2">
                <input type="number" step="0.01" id="expAmount" placeholder="0.00" required class="w-2/3 text-sm rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                <select id="expCurrency" class="w-1/3 text-sm rounded-lg border-slate-300 border p-2 bg-slate-50 font-medium">
                  <option value="ILS">₪ ILS</option>
                  <option value="USD">$ USD</option>
                  <option value="EUR">€ EUR</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Category</label>
              <select id="expCategory" class="w-full text-sm rounded-lg border-slate-300 border p-2 bg-slate-50">
                <option value="General">General</option>
                <option value="Groceries">Groceries</option>
                <option value="Dining Out">Dining Out</option>
                <option value="Utilities">Utilities & Bills</option>
                <option value="Cars">Cars</option>
                <option value="Bikes">Bikes</option>
                <option value="Online Shopping">Online Shopping</option>
                <option value="Subscriptions">Subscriptions</option>
                <option value="Travel">Travel & Transport</option>
              </select>
            </div>
            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-medium text-slate-600">Card / Account Nickname</label>
                <button type="button" onclick="switchTab('settings')" class="text-[11px] text-indigo-600 hover:underline">+ Manage</button>
              </div>
              <select id="expCard" class="w-full text-sm rounded-lg border-slate-300 border p-2 bg-slate-50">
                <option value="Default Card">Loading cards...</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Payment Method</label>
              <select id="expMethod" class="w-full text-sm rounded-lg border-slate-300 border p-2 bg-slate-50">
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Bank Transfer">Bank Transfer / Hora'at Keva</option>
                <option value="Cash / Bit">Cash / Bit</option>
              </select>
            </div>
            <div class="sm:col-span-2 md:col-span-3 flex justify-end gap-2">
              <button type="submit" id="expSubmitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2 px-6 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-check"></i> <span id="expSubmitText">Save Expense</span>
              </button>
            </div>
          </form>
        </div>

        <!-- Monthly Filter & Summary Controls -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-100 p-3 rounded-xl border border-slate-200">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-calendar text-slate-500 text-sm"></i>
            <span class="text-xs font-semibold text-slate-700">Filter Month:</span>
            <select id="monthFilter" onchange="renderExpenses(); renderAnalytics();" class="text-xs font-medium rounded-lg border-slate-300 border py-1 px-2 bg-white">
              <option value="ALL">All Time</option>
