<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Package Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-5xl mx-auto p-4 sm:p-6 pb-20">
    <!-- Header -->
    <header class="flex justify-between items-center border-b pb-4 mb-4">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-wallet text-indigo-600"></i> Expense & Package Manager
      </h1>
      <span id="syncStatus" class="text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-semibold">Ready</span>
    </header>

    <!-- Navigation Tabs -->
    <nav class="flex space-x-2 border-b mb-6 overflow-x-auto text-sm font-semibold">
      <button onclick="switchTab('expenses')" id="tab-expenses" class="px-4 py-2 border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap">Expenses</button>
      <button onclick="switchTab('analytics')" id="tab-analytics" class="px-4 py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Analytics</button>
      <button onclick="switchTab('packages')" id="tab-packages" class="px-4 py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Packages</button>
      <button onclick="switchTab('vouchers')" id="tab-vouchers" class="px-4 py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Vouchers</button>
      <button onclick="switchTab('settings')" id="tab-settings" class="px-4 py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap">Settings</button>
    </nav>

    <!-- TAB 1: EXPENSES -->
    <section id="view-expenses" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <form id="expForm" onsubmit="saveExpense(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <input type="hidden" id="editExpId" value="" />
          <input type="date" id="expDate" required class="border rounded p-2" />
          <input type="text" id="expDesc" placeholder="Description" required class="border rounded p-2" />
          <div class="flex gap-1">
            <input type="number" step="0.01" id="expAmt" placeholder="Amount" required class="border rounded p-2 w-2/3" />
            <select id="expCurr" class="border rounded p-2 w-1/3 bg-slate-50 font-bold"><option value="ILS">₪</option><option value="USD">$</option><option value="EUR">€</option></select>
          </div>
          <select id="expCat" class="border rounded p-2 bg-slate-50">
            <option>Education</option><option>Health</option><option>Shopping</option><option>Vacation</option>
            <option>Groceries</option><option>Dining Out</option><option>Utilities</option><option>Cars</option><option>Bikes</option><option>General</option>
          </select>
          <select id="expCard" class="border rounded p-2 bg-slate-50"><option value="Default Card">Default Card</option></select>
          <label class="flex items-center gap-2 text-xs font-semibold text-indigo-700">
            <input type="checkbox" id="expRec" class="w-4 h-4 rounded" /> Monthly Recurring
          </label>
          <button type="submit" class="sm:col-span-3 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">Save Expense</button>
        </form>
      </div>
      <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
        <table class="w-full text-xs sm:text-sm text-left">
          <thead class="bg-slate-100 border-b">
            <tr><th class="p-2.5">Date</th><th class="p-2.5">Desc</th><th class="p-2.5">Cat</th><th class="p-2.5">Card</th><th class="p-2.5 text-right">Orig</th><th class="p-2.5 text-right">ILS</th><th class="p-2.5 text-center">Action</th></tr>
          </thead>
          <tbody id="expTbody" class="divide-y"><tr><td colspan="7" class="p-4 text-center text-slate-400">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 2: ANALYTICS -->
    <section id="view-analytics" class="hidden space-y-4">
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <div class="bg-white p-3 rounded-xl border"><span class="text-xs text-slate-500">Total Spend</span><div id="statTotal" class="text-lg font-bold">₪0.00</div></div>
        <div class="bg-white p-3 rounded-xl border"><span class="text-xs text-emerald-600">Recurring Spend</span><div id="statRec" class="text-lg font-bold text-emerald-600">₪0.00</div></div>
        <div class="bg-white p-3 rounded-xl border col-span-2 sm:col-span-1"><span class="text-xs text-sky-600">Packages Spend</span><div id="statPkg" class="text-lg font-bold text-sky-600">₪0.00</div></div>
      </div>
      <div class="bg-white p-4 rounded-xl border"><canvas id="chartTrend" class="h-64"></canvas></div>
    </section>

    <!-- TAB 3: PACKAGES -->
    <section id="view-packages" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl border shadow-sm">
        <form id="pkgForm" onsubmit="savePackage(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <input type="hidden" id="editPkgId" value="" />
          <input type="date" id="pkgDate" required class="border rounded p-2" />
          <input type="text" id="pkgShop" placeholder="Shop (e.g. Amazon)" class="border rounded p-2" />
          <input type="text" id="pkgDesc" placeholder="Item Desc" required class="border rounded p-2" />
          <input type="text" id="pkgTrk" placeholder="Tracking #" required class="border rounded p-2 font-mono" />
          <select id="pkgFwd" class="border rounded p-2 bg-slate-50"><option>RedBox</option><option>Dealtas</option><option>UShops</option><option>Direct</option><option>Other</option></select>
          <select id="pkgStat" class="border rounded p-2 bg-slate-50"><option>Ordered</option><option>Hub</option><option>In Transit</option><option>Delivered</option></select>
          <div class="flex gap-1">
            <input type="number" step="0.01" id="pkgCost" placeholder="Cost" class="border rounded p-2 w-2/3" />
            <select id="pkgCurr" class="border rounded p-2 w-1/3 bg-slate-50 font-bold"><option value="USD">$</option><option value="ILS">₪</option><option value="EUR">€</option></select>
          </div>
          <div class="flex gap-1">
            <input type="number" step="0.01" id="pkgShip" placeholder="Shipping Fee" class="border rounded p-2 w-2/3" />
            <select id="pkgShipCurr" class="border rounded p-2 w-1/3 bg-slate-50 font-bold"><option value="USD">$</option><option value="ILS">₪</option></select>
          </div>
          <button type="submit" class="sm:col-span-3 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">Save Package</button>
        </form>
      </div>
      <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
        <table class="w-full text-xs sm:text-sm text-left">
          <thead class="bg-slate-100 border-b">
            <tr><th class="p-2.5">Date</th><th class="p-2.5">Shop</th><th class="p-2.5">Item</th><th class="p-2.5">Tracking</th><th class="p-2.5">Status</th><th class="p-2.5 text-right">Cost</th><th class="p-2.5 text-right">Landed (₪)</th><th class="p-2.5 text-center">Action</th></tr>
          </thead>
          <tbody id="pkgTbody" class="divide-y"><tr><td colspan="8" class="p-4 text-center text-slate-400">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 4: VOUCHERS -->
    <section id="view-vouchers" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl border shadow-sm">
        <form id="vchForm" onsubmit="saveVoucher(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <input type="hidden" id="editVchId" value="" />
          <input type="text" id="vchDesc" placeholder="Voucher Desc / Store" required class="border rounded p-2" />
          <input type="text" id="vchNum" placeholder="Code Number" required class="border rounded p-2 font-mono" />
          <input type="text" id="vchOrig" placeholder="Origin (e.g. Work)" class="border rounded p-2" />
          <input type="date" id="vchExp" required class="border rounded p-2" />
          <div class="flex gap-1">
            <input type="number" step="0.01" id="vchVal" placeholder="Value" required class="border rounded p-2 w-2/3" />
            <select id="vchCurr" class="border rounded p-2 w-1/3 bg-slate-50 font-bold"><option value="ILS">₪</option><option value="USD">$</option></select>
          </div>
          <button type="submit" class="sm:col-span-3 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700">Save Voucher</button>
        </form>
      </div>
      <div class="bg-white rounded-xl shadow-sm border overflow-x-auto">
        <table class="w-full text-xs sm:text-sm text-left">
          <thead class="bg-slate-100 border-b">
            <tr><th class="p-2.5 text-center">Used</th><th class="p-2.5">Desc</th><th class="p-2.5">Code</th><th class="p-2.5">Origin</th><th class="p-2.5">Expiry</th><th class="p-2.5 text-right">Value</th><th class="p-2.5 text-center">Action</th></tr>
          </thead>
          <tbody id="vchTbody" class="divide-y"><tr><td colspan="7" class="p-4 text-center text-slate-400">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- TAB 5: SETTINGS -->
    <section id="view-settings" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl border">
        <h3 class="font-bold text-sm mb-2">Local Data Control</h3>
        <button onclick="localStorage.clear(); location.reload();" class="px-3 py-1.5 bg-rose-100 text-rose-700 rounded text-xs font-semibold">Wipe Local Cache & Reload</button>
      </div>
    </section>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyum6T_l__A43wHTS7epcJoeWhaOHIjdAFFTA2aNeCpQt568WiZuLFhXeoLdeF6h5K1/exec";
    const RATES = { ILS: 1, USD: 3.70, EUR: 4.00 };

    let expenses = [], packages = [], vouchers = [], cards = [], chartInstance = null;

    function getRate(curr) {
      const c = String(curr || 'ILS').trim().toUpperCase();
      return RATES[c] || 1;
    }

    function switchTab(tab) {
      ['expenses', 'analytics', 'packages', 'vouchers', 'settings'].forEach(t => {
        const v = document.getElementById('view-' + t);
        const b = document.getElementById('tab-' + t);
        if (v) v.classList.toggle('hidden', t !== tab);
        if (b) b.className = t === tab ? "px-4 py-2 border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap" : "px-4 py-2 border-b-2 border-transparent text-slate-500 whitespace-nowrap";
      });
      if (tab === 'analytics') renderAnalytics();
    }

    function parseDate(r) {
      if (!r) return '';
      let s = String(r).replace(/^'+/, '').trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const p = Date.parse(s);
      if (!isNaN(p)) {
        const d = new Date(p);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      return s.split('T')[0];
    }

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      ['expDate', 'pkgDate', 'vchExp'].forEach(id => { const el = document.getElementById(id); if (el) el.value = today; });

      try { expenses = JSON.parse(localStorage.getItem("expenses") || "[]"); } catch(e){}
      try { packages = JSON.parse(localStorage.getItem("packages") || "[]"); } catch(e){}
      try { vouchers = JSON.parse(localStorage.getItem("vouchers") || "[]"); } catch(e){}

      renderExpenses();
      renderPackages();
      renderVouchers();
      fetchAll();
    });

    async function fetchAll() {
      fetchData("Expenses", data => {
        expenses = data.map((d, i) => {
          const amt = parseFloat(d.amount || d.Amount || 0);
          const curr = d.currency || d.Currency || 'ILS';
          const ils = parseFloat(d.ilsAmount || (amt * getRate(curr)));
          return {
            id: String(d.id || `exp_${i}`),
            date: parseDate(d.date || d.Date),
            desc: String(d.description || d.Description || 'Expense'),
            cat: String(d.category || 'General'),
            card: String(d.card || 'Default Card'),
            amt, curr, ils,
            isRec: String(d.isRecurring || '').toLowerCase() === 'yes'
          };
        }).sort((a,b) => (b.date || '').localeCompare(a.date || ''));
        localStorage.setItem("expenses", JSON.stringify(expenses));
        renderExpenses();
      });

      fetchData("Packages", data => {
        packages = data.map((d, i) => {
          const cost = parseFloat(d.itemCost || 0);
          const curr = d.currency || 'USD';
          const ship = parseFloat(d.shippingFee || 0);
          const shipCurr = d.shippingCurrency || 'USD';
          const ils = parseFloat((cost * getRate(curr) + ship * getRate(shipCurr)).toFixed(2));
          return {
            id: String(d.id || `pkg_${i}`),
            date: parseDate(d.date || d.Date),
            shop: String(d.shop || '-'),
            desc: String(d.itemDescription || 'Package'),
            trk: String(d.trackingNumber || '-'),
            fwd: String(d.forwarder || '-'),
            stat: String(d.status || 'Ordered'),
            cost, curr, ship, shipCurr, ils
          };
        });
        localStorage.setItem("packages", JSON.stringify(packages));
        renderPackages();
      });

      fetchData("Vouchers", data => {
        vouchers = data.map((d, i) => ({
          id: String(d.id || `v_${i}`),
          desc: String(d.description || 'Voucher'),
          num: String(d.number || '-'),
          orig: String(d.origin || '-'),
          exp: parseDate(d.expiryDate || d.expiry),
          val: parseFloat(d.value || 0),
          curr: d.currency || 'ILS',
          used: String(d.used || '').toLowerCase() === 'yes'
        }));
        localStorage.setItem("vouchers", JSON.stringify(vouchers));
        renderVouchers();
      });
    }

    function fetchData(sheet, cb) {
      fetch(`${SCRIPT_URL}?sheet=${sheet}&t=${Date.now()}`)
        .then(r => r.json())
        .then(d => { if (Array.isArray(d)) cb(d); })
        .catch(err => console.warn(`Load deferred for ${sheet}:`, err));
    }

    function renderExpenses() {
      const tb = document.getElementById("expTbody");
      if (!tb) return;
      if (!expenses.length) { tb.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">No expenses found.</td></tr>`; return; }
      tb.innerHTML = expenses.map(e => `
        <tr class="hover:bg-slate-50 ${e.isRec ? 'bg-indigo-50/40' : ''}">
          <td class="p-2.5 font-mono text-slate-500">${e.date}</td>
          <td class="p-2.5 font-medium">${e.desc} ${e.isRec ? '<span class="text-[10px] bg-indigo-100 text-indigo-700 font-bold px-1 rounded">Monthly</span>' : ''}</td>
          <td class="p-2.5"><span class="px-2 py-0.5 rounded text-xs bg-slate-100">${e.cat}</span></td>
          <td class="p-2.5 text-xs text-slate-500">${e.card}</td>
          <td class="p-2.5 text-right font-medium">${e.curr === 'USD' ? '$' : '₪'}${e.amt.toFixed(2)}</td>
          <td class="p-2.5 text-right font-bold">₪${e.ils.toFixed(2)}</td>
          <td class="p-2.5 text-center"><button onclick="deleteRow('Expenses', '${e.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></td>
        </tr>
      `).join('');
    }

    function renderPackages() {
      const tb = document.getElementById("pkgTbody");
      if (!tb) return;
      if (!packages.length) { tb.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-slate-400">No packages tracked.</td></tr>`; return; }
      tb.innerHTML = packages.map(p => `
        <tr class="hover:bg-slate-50">
          <td class="p-2.5 font-mono text-slate-500">${p.date}</td>
          <td class="p-2.5">${p.shop}</td>
          <td class="p-2.5 font-medium">${p.desc}</td>
          <td class="p-2.5 font-mono">${p.trk}</td>
          <td class="p-2.5"><span class="px-2 py-0.5 rounded text-xs bg-slate-100">${p.stat}</span></td>
          <td class="p-2.5 text-right">${p.curr === 'USD' ? '$' : '₪'}${p.cost.toFixed(2)}</td>
          <td class="p-2.5 text-right font-bold text-slate-900">₪${p.ils.toFixed(2)}</td>
          <td class="p-2.5 text-center"><button onclick="deleteRow('Packages', '${p.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></td>
        </tr>
      `).join('');
    }

    function renderVouchers() {
      const tb = document.getElementById("vchTbody");
      if (!tb) return;
      if (!vouchers.length) { tb.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">No vouchers added.</td></tr>`; return; }
      tb.innerHTML = vouchers.map(v => `
        <tr class="hover:bg-slate-50 ${v.used ? 'opacity-40 line-through' : ''}">
          <td class="p-2.5 text-center"><input type="checkbox" ${v.used ? 'checked' : ''} onchange="toggleVoucher('${v.id}', this.checked)" class="w-4 h-4 rounded text-indigo-600" /></td>
          <td class="p-2.5 font-medium">${v.desc}</td>
          <td class="p-2.5 font-mono">${v.num}</td>
          <td class="p-2.5 text-slate-500">${v.orig}</td>
          <td class="p-2.5 font-mono text-slate-500">${v.exp}</td>
          <td class="p-2.5 text-right font-bold">₪${v.val.toFixed(2)}</td>
          <td class="p-2.5 text-center"><button onclick="deleteRow('Vouchers', '${v.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></td>
        </tr>
      `).join('');
    }

    function saveExpense(e) {
      e.preventDefault();
      const amt = parseFloat(document.getElementById("expAmt").value);
      const curr = document.getElementById("expCurr").value;
      const payload = {
        id: "exp_" + Date.now(),
        date: document.getElementById("expDate").value,
        description: document.getElementById("expDesc").value,
        amount: amt,
        currency: curr,
        ilsAmount: parseFloat((amt * getRate(curr)).toFixed(2)),
        category: document.getElementById("expCat").value,
        card: document.getElementById("expCard").value,
        isRecurring: document.getElementById("expRec").checked ? "Yes" : "No"
      };
      expenses.unshift({ ...payload, desc: payload.description, amt: payload.amount, ils: payload.ilsAmount, cat: payload.category, isRec: payload.isRecurring === 'Yes' });
      localStorage.setItem("expenses", JSON.stringify(expenses));
      renderExpenses();
      document.getElementById("expDesc").value = "";
      document.getElementById("expAmt").value = "";
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add", sheet: "Expenses", data: payload }) });
    }

    function savePackage(e) {
      e.preventDefault();
      const cost = parseFloat(document.getElementById("pkgCost").value) || 0;
      const curr = document.getElementById("pkgCurr").value;
      const ship = parseFloat(document.getElementById("pkgShip").value) || 0;
      const shipCurr = document.getElementById("pkgShipCurr").value;
      const ils = parseFloat((cost * getRate(curr) + ship * getRate(shipCurr)).toFixed(2));
      const payload = {
        id: "pkg_" + Date.now(),
        date: document.getElementById("pkgDate").value,
        shop: document.getElementById("pkgShop").value,
        itemDescription: document.getElementById("pkgDesc").value,
        trackingNumber: document.getElementById("pkgTrk").value,
        forwarder: document.getElementById("pkgFwd").value,
        status: document.getElementById("pkgStat").value,
        itemCost: cost, currency: curr, shippingFee: ship, shippingCurrency: shipCurr,
        totalCostIls: ils
      };
      packages.unshift({ ...payload, desc: payload.itemDescription, trk: payload.trackingNumber, fwd: payload.forwarder, stat: payload.status, cost, curr, ship, shipCurr, ils });
      localStorage.setItem("packages", JSON.stringify(packages));
      renderPackages();
      document.getElementById("pkgDesc").value = "";
      document.getElementById("pkgCost").value = "";
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add", sheet: "Packages", data: payload }) });
    }

    function saveVoucher(e) {
      e.preventDefault();
      const payload = {
        id: "v_" + Date.now(),
        description: document.getElementById("vchDesc").value,
        number: document.getElementById("vchNum").value,
        origin: document.getElementById("vchOrig").value,
        expiryDate: document.getElementById("vchExp").value,
        value: parseFloat(document.getElementById("vchVal").value) || 0,
        currency: document.getElementById("vchCurr").value,
        used: "No"
      };
      vouchers.unshift({ ...payload, desc: payload.description, num: payload.number, orig: payload.origin, exp: payload.expiryDate, val: payload.value, used: false });
      localStorage.setItem("vouchers", JSON.stringify(vouchers));
      renderVouchers();
      document.getElementById("vchDesc").value = "";
      document.getElementById("vchNum").value = "";
      document.getElementById("vchVal").value = "";
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add", sheet: "Vouchers", data: payload }) });
    }

    function toggleVoucher(id, used) {
      const v = vouchers.find(x => x.id === id);
      if (v) {
        v.used = used;
        localStorage.setItem("vouchers", JSON.stringify(vouchers));
        renderVouchers();
        fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "update", sheet: "Vouchers", id, data: { used: used ? "Yes" : "No" } }) });
      }
    }

    function deleteRow(sheet, id) {
      if (!confirm("Delete entry?")) return;
      if (sheet === 'Expenses') expenses = expenses.filter(x => x.id !== id);
      if (sheet === 'Packages') packages = packages.filter(x => x.id !== id);
      if (sheet === 'Vouchers') vouchers = vouchers.filter(x => x.id !== id);
      localStorage.setItem(sheet.toLowerCase(), JSON.stringify(sheet === 'Expenses' ? expenses : sheet === 'Packages' ? packages : vouchers));
      if (sheet === 'Expenses') renderExpenses();
      if (sheet === 'Packages') renderPackages();
      if (sheet === 'Vouchers') renderVouchers();
      fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", sheet, id }) });
    }

    function renderAnalytics() {
      let tot = 0, rec = 0, pkgTot = 0;
      expenses.forEach(e => { tot += e.ils; if (e.isRec) rec += e.ils; });
      packages.forEach(p => { pkgTot += p.ils; });
      document.getElementById("statTotal").textContent = `₪${tot.toFixed(2)}`;
      document.getElementById("statRec").textContent = `₪${rec.toFixed(2)}`;
      document.getElementById("statPkg").textContent = `₪${pkgTot.toFixed(2)}`;
    }
  </script>
</body>
</html>
